name: Prenotazione Automatica Piscina

on:
  schedule:
    # 'min ore+2 * * giorni'
    - cron: '6 23 * * 2,3'
  
  workflow_dispatch:

jobs:
  esegui-bot:
    runs-on: ubuntu-latest
    
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa librerie
        run: pip install requests

      - name: Lancia lo script di prenotazione
        run: python prenota.py

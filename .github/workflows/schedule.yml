name: Prenotazione Automatica Piscina

on:
  workflow_dispatch: # Permette l'avvio manuale e tramite API esterne

jobs:
  esegui-bot:
    runs-on: ubuntu-latest
    
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa librerie
        run: pip install requests

      - name: Lancia lo script di prenotazione
        run: python prenota.py
